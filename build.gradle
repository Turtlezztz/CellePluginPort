plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'dk.setups'
version = '2.0.0'

def paperVersion = '26.2.build.129-stable'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ['-parameters']
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://maven.enginehub.org/repo/' }
    maven { url = 'https://storehouse.okaeri.eu/repository/maven-releases/' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url = 'https://jitpack.io' }
}

// Paper owns Adventure, Gson and Guava. Never shade a second copy of its public API.
configurations.configureEach {
    exclude group: 'org.spigotmc'
    exclude group: 'org.bukkit'
    exclude group: 'net.kyori', module: 'adventure-platform-bukkit'
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${paperVersion}"
    compileOnly 'com.sk89q.worldguard:worldguard-bukkit:7.0.19'
    compileOnly 'com.sk89q.worldedit:worldedit-bukkit:7.4.5'
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7'
    compileOnly 'me.clip:placeholderapi:2.12.3'
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    implementation 'com.j256.ormlite:ormlite-jdbc:6.1'
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    implementation 'org.yaml:snakeyaml:2.2'
    implementation('dev.triumphteam:triumph-gui:3.1.13') { exclude group: 'net.kyori' }
    implementation('eu.okaeri:okaeri-platform-bukkit:0.4.19') {
        exclude group: 'com.google'
        exclude group: 'net.kyori'
    }
    implementation('eu.okaeri:okaeri-i18n-minecraft-adventure:5.1.0') {
        exclude group: 'com.google'
        exclude group: 'net.kyori'
    }
    implementation 'eu.okaeri:okaeri-configs-yaml-snakeyaml:5.0.1'

    testImplementation "io.papermc.paper:paper-api:${paperVersion}"
    testImplementation 'com.sk89q.worldguard:worldguard-bukkit:7.0.19'
    testImplementation 'com.sk89q.worldedit:worldedit-bukkit:7.4.5'
    testImplementation 'org.mockbukkit.mockbukkit:mockbukkit-v26.2:4.116.1'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.processResources {
    inputs.property 'version', project.version
    filesMatching('plugin.yml') { expand(version: project.version) }
}

tasks.test { useJUnitPlatform() }

tasks.shadowJar {
    archiveClassifier = 'combined'
    mergeServiceFiles()
    relocate 'eu.okaeri', 'dk.setups.libs.celle.eu.okaeri'
    relocate 'org.yaml', 'dk.setups.libs.celle.org.yaml'
    relocate 'com.j256', 'dk.setups.libs.celle.com.j256'
    relocate 'dev.triumphteam', 'dk.setups.libs.celle.dev.triumphteam'
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}

tasks.register('combinedJar') { dependsOn tasks.shadowJar }
tasks.build { dependsOn tasks.shadowJar }
